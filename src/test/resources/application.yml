spring:
  datasource:
    url: jdbc:h2:mem:nodus_core;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true

nodus:
  core:
    api-key: test-api-key
    idempotency-ttl: 1h
    reminder-scan-interval: 1h
    delivery-retry-delay: 10ms
    delivery-lease: 1s

debug: false

logging:
  level:
    root: WARN
