server:
  port: ${NODUS_CORE_PORT:8094}
  shutdown: graceful

spring:
  application:
    name: nodus-core-service
  datasource:
    url: ${NODUS_CORE_DB_URL:jdbc:postgresql://127.0.0.1:5432/nodus_core}
    username: ${NODUS_CORE_DB_USER:nodus_core}
    password: ${NODUS_CORE_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${NODUS_CORE_DB_POOL_SIZE:10}
      minimum-idle: 1
      connection-timeout: 5000
  flyway:
    enabled: true
    validate-on-migrate: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: nodus-core-service
    phase: P4-media-library

nodus:
  core:
    api-key: ${NODUS_CORE_API_KEY:}
    idempotency-ttl: ${NODUS_CORE_IDEMPOTENCY_TTL:24h}
    reminder-scan-interval: ${NODUS_CORE_REMINDER_SCAN_INTERVAL:1s}
    delivery-retry-delay: ${NODUS_CORE_DELIVERY_RETRY_DELAY:15s}
    delivery-lease: ${NODUS_CORE_DELIVERY_LEASE:30s}
    insight-ainas-enabled: ${NODUS_CORE_INSIGHT_AINAS_ENABLED:false}
    insight-ainas-base-url: ${NODUS_CORE_INSIGHT_AINAS_BASE_URL:http://127.0.0.1:8083}
    insight-ainas-api-key: ${NODUS_CORE_INSIGHT_AINAS_API_KEY:}
    insight-ainas-timeout: ${NODUS_CORE_INSIGHT_AINAS_TIMEOUT:90s}
    media:
      staging-directory: ${NODUS_MEDIA_STAGING_DIR:/home/aidlux/Videos/NodusMedia/staging}
      movies-directory: ${NODUS_MEDIA_MOVIES_DIR:/home/aidlux/Videos/NodusMedia/Movies}
      shows-directory: ${NODUS_MEDIA_SHOWS_DIR:/home/aidlux/Videos/NodusMedia/TV}
      minimum-free-bytes: ${NODUS_MEDIA_MIN_FREE_BYTES:10737418240}
      maximum-library-bytes: ${NODUS_MEDIA_MAX_LIBRARY_BYTES:10737418240}
      maximum-file-bytes: ${NODUS_MEDIA_MAX_FILE_BYTES:8589934592}
      ffprobe-path: ${NODUS_MEDIA_FFPROBE_PATH:/usr/bin/ffprobe}
      verification-interval: ${NODUS_MEDIA_VERIFICATION_INTERVAL:2s}
      jellyfin-base-url: ${NODUS_JELLYFIN_BASE_URL:http://127.0.0.1:8096}
      jellyfin-api-key: ${NODUS_JELLYFIN_API_KEY:}
      jellyfin-timeout: ${NODUS_JELLYFIN_TIMEOUT:5s}
